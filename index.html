<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rixētranzlātr</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div id="app" class="container py-5">
      <h1>Rixētranzlātr</h1>
      <p class="text-muted">
        Māx Rixē mor undrstandbl, krīz verē hard tu krēāt :(
      </p>

      <textarea class="form-control mb-3" rows="8" v-model="input"></textarea>

      <div class="d-flex flex-row align-items-baseline gap-3">
        <button class="btn btn-primary mb-3" @click="convert">Convert</button>
        <div class="form-check form-switch">
          <input
            type="checkbox"
            role="button"
            class="form-check-input"
            id="flexSwitchCheckDefault"
          />
          <label
            role="button"
            class="form-check-label text-muted user-select-none"
            for="flexSwitchCheckDefault"
            >English to Rixespek</label
          >
        </div>
      </div>

      <div class="border p-3 text-break rounded" style="white-space: pre-wrap">
        <template
          v-for="(token, i) in outputTokens"
          :key="i"
          style="word-spacing: 0px"
        >
          <span v-if="token.type === 'text'"> {{ token.value }} </span>
          <span
            v-else-if="token.type === 'word'"
            class="word"
            :class="{ 'has-options': (token.phonetics?.length > 1) || (token.cases?.length > 1) }"
            @click="openOptions(token, $event)"
          >
            {{ token.value }}
          </span>

          <span
            v-else-if="token.type === 'unknown'"
            class="word unknown has-options"
            @click="openErrorOptions(token, $event)"
          >
            {{ token.value }}
          </span>
        </template>
      </div>
      <div
        id="wordMenu"
        class="dropdown-menu show"
        style="position: absolute; display: none"
      >
        <div class="dropdown-header">Phonetics</div>

        <button
          v-for="p in menuPhonetics"
          class="dropdown-item"
          @click.stop="choosePhonetic(p)"
        >
          {{ p }}
        </button>

        <div class="dropdown-divider"></div>

        <div class="dropdown-header">Cases</div>

        <button
          v-for="c in menuCases"
          class="dropdown-item"
          @click.stop="chooseCase(c)"
        >
          {{ c }}
        </button>
      </div>
    </div>
  </body>
</html>
