<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rixētranzlātr</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div id="app" class="container py-5">
      <h1>Rixētranzlātr</h1>
      <p class="text-muted">
        Māx Rixē mor undrstandbl, krīz verē hard tu krēāt :(
      </p>

      <textarea class="form-control mb-3" rows="8" v-model="input"></textarea>

      <button class="btn btn-primary mb-3" @click="convert">Convert</button>

      <!-- <div style="white-space: pre-wrap" class="border p-3 text-break rounded">
        {{ output }}
      </div> -->
      <div class="border p-3 text-break rounded" style="white-space: pre-wrap">
        <template v-for="(token, i) in outputTokens" :key="i">
          <span v-if="token.type === 'text'"> {{ token.value }} </span>

          <span
            v-else
            class="word"
            @click="openOptions(token, $event)"
            style="cursor: pointer"
          >
            {{ token.value }}
          </span>
        </template>
      </div>
      <div
        id="wordMenu"
        class="dropdown-menu show"
        style="position: absolute; display: none"
      >
        <div class="dropdown-header">Phonetics</div>

        <button
          v-for="p in activeWord?.phonetics"
          class="dropdown-item"
          @click="choosePhonetic(p)"
        >
          {{ p }}
        </button>

        <div class="dropdown-divider"></div>

        <div class="dropdown-header">Cases</div>

        <button v-for="c in activeWord?.cases" class="dropdown-item">
          {{ c }}
        </button>
      </div>
    </div>
  </body>
</html>
